<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <script src="https://unpkg.com/html5-qrcode@2.0.9/dist/html5-qrcode.min.js"></script>
    <style>
        body {
            text-align: center;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #f5f7fa;
        }
        #reader {
            width: 100%;
            padding: 0;
        }
        .reader-container {
            position: relative;
            width: 70%;
            max-width: 500px;
            margin-top: 10px;
            margin-bottom: 20px;
            padding: 0;
        }
        .corner {
            position: absolute;
            width: 25%;
            height: 25%;
            border: 4px solid rgb(117, 117, 117);
            box-sizing: border-box;
            pointer-events: none;
        }
        .corner.top-left {
            top: 0;
            left: 0;
            border-right: none;
            border-bottom: none;
        }
        .corner.top-right {
            top: 0;
            right: 0;
            border-left: none;
            border-bottom: none;
        }
        .corner.bottom-left {
            bottom: 5px;
            left: 0;
            border-right: none;
            border-top: none;
        }
        .corner.bottom-right {
            bottom: 5px;
            right: 0;
            border-left: none;
            border-top: none;
        }
        .corner.detected {
            border-color: rgb(0, 226, 0);
        }
        .corner.error {
            border-color: rgb(220, 53, 69);
        }
        #result-name, #result-email, #result-status {
            margin: 6px 0;
            font-size: 1.1rem;
        }
        #result-image {
            margin: 12px 0;
            max-width: 240px;
            max-height: 320px;
            border-radius: 8px;
            display: none;
        }
        #result-image.visible {
            display: inline-block;
        }
        .home-link {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 16px;
            background-color: #002955;
            color: white;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
        }
        .home-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <a class="home-link" href="/">Ticket</a>
    <h2>Ticket Scanner</h2>
    <div class="reader-container">
        <div id="reader"></div>
        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>
    </div>
    <p id="result-name">Name: —</p>
    <p id="result-email">Email: —</p>
    <p id="result-status"></p>
    <img id="result-image" alt="Student photo">

    <script>
        const scannerApiKey = {{ scanner_api_key|tojson }};
        const DEDUP_MS = 60000;
        let lastScan = { payload: null, at: 0 };
        let requestInFlight = false;

        function scanHeaders() {
            const headers = { 'Content-Type': 'application/json' };
            if (scannerApiKey) {
                headers['X-API-Key'] = scannerApiKey;
            }
            return headers;
        }

        function setCorners(state) {
            document.querySelectorAll('.corner').forEach(corner => {
                corner.classList.remove('detected', 'error');
                if (state) {
                    corner.classList.add(state);
                }
            });
        }

        function showResult(data) {
            const nameDiv = document.getElementById('result-name');
            const emailDiv = document.getElementById('result-email');
            const statusDiv = document.getElementById('result-status');
            const imageDiv = document.getElementById('result-image');

            nameDiv.textContent = `Name: ${data.name || 'N/A'}`;
            emailDiv.textContent = `Email: ${data.email || '—'}`;

            if (data.image_url) {
                imageDiv.src = data.image_url;
                imageDiv.classList.add('visible');
            } else {
                imageDiv.removeAttribute('src');
                imageDiv.classList.remove('visible');
            }

            statusDiv.textContent = data.duplicate ? '(already scanned recently)' : '';
        }

        function showError(message) {
            setCorners('error');
            document.getElementById('result-status').textContent = message;
        }

        function qrCodeSuccessCallback(decodedText) {
            const now = Date.now();
            if (requestInFlight) {
                return;
            }
            if (decodedText === lastScan.payload && now - lastScan.at < DEDUP_MS) {
                return;
            }

            requestInFlight = true;
            setCorners('detected');

            fetch('/scanner_result', {
                method: 'POST',
                headers: scanHeaders(),
                credentials: 'same-origin',
                body: JSON.stringify({ data: decodedText })
            })
            .then(response => response.json().then(body => ({ ok: response.ok, body })))
            .then(({ ok, body }) => {
                if (!ok) {
                    const msg = body.error?.message || 'Scan failed';
                    showError(msg);
                    return;
                }
                lastScan = { payload: decodedText, at: Date.now() };
                showResult(body);
            })
            .catch((error) => {
                console.error('Error:', error);
                showError('Network error — check connection');
            })
            .finally(() => {
                requestInFlight = false;
            });
        }

        function qrCodeFailCallback() {
            setCorners(null);
        }

        const html5QrCode = new Html5Qrcode(
            "reader",
            { formatsToSupport: [ Html5QrcodeSupportedFormats.QR_CODE ] }
        );

        html5QrCode.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: { width: 250, height: 250 } },
            qrCodeSuccessCallback,
            qrCodeFailCallback
        ).catch((error) => {
            console.error('Camera error:', error);
            showError('Camera unavailable — allow camera access and reload');
        });
    </script>
</body>
</html>
